name: Build prototipo Excel

on:
  push:
    paths:
      - 'excel/prototipo-base64/**'
      - '.github/workflows/build-prototipo-excel.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Reconstruir workbook
        shell: bash
        run: |
          set -euo pipefail
          cat excel/prototipo-base64/part-*.b64 | base64 --decode > excel/Preventiva_Rodante_Prototipo.xlsx
          echo "4cc90e745b7172bffa0bfc128880f502c3949fd868bfdfa2600fad167143e626  excel/Preventiva_Rodante_Prototipo.xlsx" | sha256sum -c -

      - name: Commitar workbook reconstruido
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add excel/Preventiva_Rodante_Prototipo.xlsx
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "test: adicionar protótipo Excel reconstruído"
          git push
