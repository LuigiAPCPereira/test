name: Fiscal Processor CI

on:
  pull_request:
    paths:
      - "fiscal-processor/**"
      - ".github/workflows/fiscal-processor-ci.yml"
  push:
    branches:
      - "feat/fiscal-processor-local-v0.1"
    paths:
      - "fiscal-processor/**"
      - ".github/workflows/fiscal-processor-ci.yml"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: fiscal-processor

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install
        run: python -m pip install -e ".[dev]"

      - name: Ruff
        run: |
          ruff check .
          ruff format --check .

      - name: Mypy
        run: mypy src

      - name: Pytest
        run: pytest
