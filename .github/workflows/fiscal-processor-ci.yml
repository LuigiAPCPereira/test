name: Fiscal Processor CI

on:
  pull_request:
    paths:
      - 'fiscal-processor/**'
      - '.github/workflows/fiscal-processor-ci.yml'
  push:
    branches: [main]
    paths:
      - 'fiscal-processor/**'
      - '.github/workflows/fiscal-processor-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fiscal-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Python 3.12 / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022]
    defaults:
      run:
        working-directory: fiscal-processor
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - name: Install core and development dependencies
        run: python -m pip install -e ".[dev]"
      - name: Lint
        run: python -m ruff check .
      - name: Formatting
        run: python -m ruff format --check .
      - name: Types
        run: python -m mypy src
      - name: Synthetic unit and integration tests
        run: python -m pytest -ra
      - name: Compile source
        run: python -m compileall -q src benchmarks tests
      - name: Build Python wheel (not portable Windows application)
        run: python -m pip wheel . --no-deps --wheel-dir dist
